<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>광물 잠입 방탈출 웹앱</title>
  <style>
    :root{
      --bg:#020617;--panel:#0f172a;--panel2:#111827;--line:#334155;--txt:#e2e8f0;--muted:#94a3b8;
      --cyan:#22d3ee;--emerald:#34d399;--rose:#fb7185;--amber:#fbbf24;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;background:#000;color:var(--txt)}
    body{overflow:hidden}
    button,input{font:inherit}
    .app{min-height:100vh;background:linear-gradient(135deg,#0f172a,#111827 45%,#020617)}
    .topbar,.bottombar{position:fixed;left:0;right:0;z-index:40;background:rgba(2,6,23,.92);backdrop-filter:blur(10px)}
    .topbar{top:0;border-bottom:1px solid #1e293b}
    .bottombar{bottom:0;border-top:1px solid #1e293b}
    .wrap{max-width:1200px;margin:0 auto;padding:12px 16px}
    .topgrid{display:flex;gap:12px;align-items:center;justify-content:space-between}
    .title{font-size:1.35rem;font-weight:800}
    .subtitle,.objective,.muted{color:var(--muted)}
    .subtitle{font-size:.92rem}
    .objective{font-size:.84rem;margin-top:4px}
    .hud-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .badge,.btn,.pill,.slot,.log,.panel,.modal-card,.note-card,.ibox,.smallbtn,.answer-input,.inventory-item,.doorbox,.sign,.collector,.rock,.sample{border:1px solid #334155}
    .badge,.pill{padding:8px 12px;border-radius:999px;background:#111827;font-size:.85rem}
    .btn,.smallbtn{background:#1e293b;color:var(--txt);border-radius:16px;padding:10px 14px;cursor:pointer}
    .btn.primary{background:#0f766e;border-color:#155e75}
    .btn:hover,.smallbtn:hover,.inventory-item:hover,.hotspot:hover,.rock:hover,.sample:hover{filter:brightness(1.08)}
    .progress{width:180px;height:8px;background:#1e293b;border-radius:999px;overflow:hidden}
    .progress>div{height:100%;background:var(--cyan)}
    main{padding:92px 16px 84px;height:100vh}
    .scene{position:relative;height:100%;max-width:1200px;margin:0 auto;overflow:hidden;border:1px solid #1e293b;border-radius:28px;background:rgba(2,6,23,.45);box-shadow:0 20px 50px rgba(0,0,0,.35)}
    .scene-tag{position:absolute;left:16px;top:16px;z-index:20;padding:10px 14px;border-radius:18px;background:rgba(2,6,23,.88);border:1px solid #334155}
    .scene-tag .cap{font-size:.78rem;color:var(--muted)}
    .hotspot,.far-door,.sample,.rock,.bubble{position:absolute;z-index:10;cursor:pointer}
    .hotspot{background:transparent;border:none}
    .caption{position:absolute;left:20px;bottom:20px;z-index:20;max-width:520px;padding:14px 16px;border-radius:22px;background:rgba(245,158,11,.12);border:1px solid rgba(251,191,36,.25);color:#fde68a;font-size:.95rem;line-height:1.6}
    .corridor-bg{position:absolute;inset:0;background:radial-gradient(circle at top,rgba(59,130,246,.14),transparent 18%),linear-gradient(to bottom,#071225,#0a1630 22%,#08101f 50%,#050913)}
    .panelbox{position:absolute;left:10.5%;top:17%;width:18%;height:45%;border-radius:26px;border:1px solid rgba(103,232,249,.35);background:linear-gradient(180deg,rgba(8,47,73,.68),rgba(15,23,42,.88))}
    .commbox{position:absolute;right:11.5%;top:12.5%;width:16%;height:22%;border-radius:999px;border:1px solid rgba(52,211,153,.25);background:radial-gradient(circle at center,rgba(16,185,129,.2),rgba(2,6,23,.8))}
    .centerdoor{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:17%;height:58%;border-radius:2.8rem 2.8rem .8rem .8rem;border:1px solid rgba(255,255,255,.15);background:linear-gradient(to bottom,rgba(71,85,105,.75),rgba(15,23,42,.95))}
    .doorinner{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:8.6%;height:20%;border-radius:1.2rem;background:rgba(30,41,59,.55);border:1px solid rgba(255,255,255,.08)}
    .doorknob{position:absolute;left:55.8%;top:50%;width:14px;height:14px;border-radius:50%;background:#fde047}
    .doorlabel{position:absolute;left:50%;top:65%;transform:translateX(-50%);text-align:center}
    .doorlock{margin-top:8px;display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(244,63,94,.18);border:1px solid rgba(244,63,94,.25);font-size:.9rem}
    .lab-bg{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(71,85,105,.35),rgba(15,23,42,.92))}
    .lab-bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:rgba(2,6,23,.92)}
    .table{position:absolute;left:10%;right:10%;bottom:18%;height:18%;border-radius:28px;background:rgba(30,41,59,.72);border:1px solid rgba(148,163,184,.5)}
    .wide-table{position:absolute;left:10%;width:66%;bottom:20%;height:18%;border-radius:28px;background:rgba(30,41,59,.72);border:1px solid rgba(148,163,184,.5)}
    .doorbox{border-radius:2rem 2rem .75rem .75rem;background:linear-gradient(to bottom,#475569,#0f172a);height:100%;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:12px}
    .doorbox small{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:999px;background:rgba(244,63,94,.18);color:#fecdd3}
    .panel{position:absolute;top:14%;right:16px;z-index:20;width:340px;max-height:72%;overflow:auto;border-radius:28px;background:rgba(2,6,23,.9);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .panel h3{margin:0 0 12px;font-size:1rem}
    .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .ibox{padding:12px;border-radius:18px;background:rgba(15,23,42,.72);font-size:.92rem;color:#cbd5e1;line-height:1.55}
    .ibox + .ibox{margin-top:8px}
    .answer-input{width:100%;padding:14px 16px;border-radius:18px;background:rgba(2,6,23,.9);color:#fff;margin-top:12px}
    .feedback{margin-top:12px;padding:12px;border-radius:18px;font-size:.92rem}
    .ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.2);color:#a7f3d0}
    .bad{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.2);color:#fecdd3}
    .minbtn{position:absolute;right:16px;top:14%;z-index:20}
    .sample,.rock{width:12%;height:12%;border:none;background:none}
    .sample > div,.rock > div{width:100%;height:100%;border-radius:1.75rem;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10%;font-weight:800;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
    .s-dark{background:linear-gradient(135deg,#3f3f46,#111827,#000)}
    .s-calcite{background:linear-gradient(135deg,#78716c,#44403c,#0c0a09)}
    .s-quartz{background:linear-gradient(135deg,#64748b,#334155,#020617)}
    .s-magnetite{background:linear-gradient(135deg,#475569,#18181b,#000)}
    .s-diamond{background:linear-gradient(135deg,#71717a,#475569,#000)}
    .s-light{background:linear-gradient(135deg,#cbd5e1,#64748b,#334155)}
    .reacted{opacity:.7;box-shadow:inset 0 0 0 2px rgba(52,211,153,.7)}
    .seen::after{content:"✓";position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#22c55e;color:#fff;font-size:.8rem}
    .active-ring{box-shadow:0 0 0 2px var(--cyan), inset 0 0 0 1px rgba(255,255,255,.08)!important}
    .slots{position:absolute;left:10%;bottom:1.5%;z-index:20;width:66%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .slot{border-style:dashed;border-color:rgba(34,211,238,.3);background:rgba(2,6,23,.85);border-radius:18px;padding:12px;text-align:center}
    .slot-label{font-size:.75rem;color:var(--muted);margin-bottom:8px}
    .slot-btn{width:100%;padding:16px 8px;border-radius:14px;background:#1e293b;color:#fff;border:none;cursor:pointer;font-weight:700;font-size:1.1rem}
    .slot-empty{padding:16px 8px;border-radius:14px;background:rgba(15,23,42,.8);color:#64748b}
    .collector{position:absolute;left:50%;top:24%;transform:translateX(-50%);width:18%;height:24%;z-index:10;border-radius:2rem;background:rgba(34,211,238,.08);box-shadow:0 0 40px rgba(34,211,238,.14)}
    .collector-title{position:absolute;left:12px;right:12px;top:12px;padding:8px 10px;border-radius:14px;text-align:center;background:rgba(2,6,23,.45);color:#cffafe;font-size:.9rem}
    .collector-bar{position:absolute;left:16px;right:16px;bottom:16px;height:24px;border-radius:999px;background:rgba(2,6,23,.88);overflow:hidden}
    .collector-bar>div{height:100%;background:rgba(34,211,238,.6)}
    .collector-count{position:absolute;left:0;right:0;bottom:48px;text-align:center;font-size:.8rem}
    .bubble{width:32px;height:32px;border-radius:50%;background:rgba(165,243,252,.72);border:1px solid rgba(224,242,254,.5);box-shadow:0 0 20px rgba(103,232,249,.55);cursor:grab}
    .sign{position:absolute;left:10%;top:18%;z-index:10;width:24%;padding:16px;border-radius:28px;background:rgba(2,6,23,.84)}
    .vaultbox{position:absolute;left:50%;top:20%;transform:translateX(-50%);z-index:10;width:36%;padding:24px;border-radius:34px;background:rgba(2,6,23,.9)}
    .code-big{text-align:center;font-size:2rem;letter-spacing:.35em;font-weight:800;color:#a5f3fc;margin-top:4px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .overlay{position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-card{width:min(820px,100%);border-radius:32px;background:#020617;box-shadow:0 20px 40px rgba(0,0,0,.45)}
    .modal-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid #1e293b;padding:20px 24px}
    .modal-body{padding:24px}
    .close{border-radius:16px;background:#0f172a;color:#cbd5e1;padding:10px 12px;cursor:pointer}
    .inventory-grid,.note-grid{display:grid;gap:12px}
    .inventory-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
    .note-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
    .inventory-item{padding:16px;border-radius:24px;background:rgba(15,23,42,.72);cursor:pointer;text-align:left}
    .inventory-item.active{border-color:var(--cyan);background:rgba(6,182,212,.09)}
    .iconbox{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:16px;background:#1e293b;margin-right:10px;font-weight:700}
    .logwrap{display:flex;gap:10px;overflow:auto}
    .log{min-width:260px;padding:10px 12px;border-radius:18px;background:rgba(15,23,42,.82);font-size:.82rem;color:#cbd5e1}
    .bubble.dragging{cursor:grabbing}
    @media (max-width:900px){
      .progress,.hud-mid,.badge{display:none}
      .panel{width:min(92vw,340px)}
      .vaultbox{width:78%}.sign{width:36%}
    }
    @media (max-width:700px){
      .title{font-size:1.1rem}.subtitle{font-size:.8rem}.objective{font-size:.75rem}
      main{padding-left:8px;padding-right:8px}
      .scene{border-radius:22px}
      .panel{left:50%;right:auto;transform:translateX(-50%);width:min(92vw,360px)}
      .minbtn{right:12px}.sign{position:relative;left:auto;top:auto;width:auto;margin:86px 12px 0}.vaultbox{position:relative;left:auto;top:auto;transform:none;width:auto;margin:12px}
    }
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const META={
  intro:{title:"잠입 시작 복도",subtitle:"비밀 지질 연구소 지하 복도",objective:"위조 카드를 선택해 복도 끝 문을 열어라."},
  analysis:{title:"표본 분석실",subtitle:"조흔색으로 광물 판별",objective:"조흔색을 보고 제시된 광물의 기호를 맞혀라."},
  physical:{title:"물성 실험실",subtitle:"굳기와 자성",objective:"광물을 서로 긁고 자성을 확인해 올바르게 배열하라."},
  reaction:{title:"반응 실험실",subtitle:"이산화탄소 포집",objective:"광물과 염산 반응으로 만든 이산화탄소를 포집 장치에 넣어라."},
  vault:{title:"루덴 코어 보관실",subtitle:"최종 금고 해제",objective:"획득한 3자리 코드와 마지막 2자리 힌트를 이용해 금고를 열어라."}
};
const TOOLS=[
  {id:'fakeCard',label:'위조 카드',desc:'복도 보안문 단말기에 사용'},
  {id:'streakPlate',label:'조흔판',desc:'광물의 조흔색 확인'},
  {id:'magnet',label:'소형 자석',desc:'자성 확인'},
  {id:'acid',label:'염산 드로퍼',desc:'방해석 반응 확인'},
  {id:'physicalKey',label:'물성 실험실 열쇠',desc:'물성 실험실 문을 여는 열쇠'},
  {id:'reactionKey',label:'반응 실험실 열쇠',desc:'반응 실험실 문을 여는 열쇠'}
];
const ANALYSIS_MINERALS=[
  {id:'biotite',symbol:'A',mineral:'흑운모',x:'18%',y:'56%',streak:'흰색'},
  {id:'hematite',symbol:'B',mineral:'적철석',x:'43%',y:'51%',streak:'붉은 갈색'},
  {id:'magnetiteA',symbol:'C',mineral:'자철석',x:'67%',y:'57%',streak:'검은색'}
];
const ANALYSIS_QUESTIONS=[
  {mineral:'적철석',prompt:'적철석에 해당하는 것의 기호를 찾아 쓰시오.'},
  {mineral:'자철석',prompt:'자철석에 해당하는 것의 기호를 찾아 쓰시오.'},
  {mineral:'흑운모',prompt:'흑운모에 해당하는 것의 기호를 찾아 쓰시오.'}
];
const PHYSICAL_MINERALS=[
  {id:'calcite',symbol:'A',mineral:'방해석',x:'14%',y:'60%',hardness:3,magnetic:false,cls:'s-calcite'},
  {id:'quartz',symbol:'B',mineral:'석영',x:'32%',y:'54%',hardness:7,magnetic:false,cls:'s-quartz'},
  {id:'magnetite',symbol:'C',mineral:'자철석',x:'50%',y:'58%',hardness:6,magnetic:true,cls:'s-magnetite'},
  {id:'diamond',symbol:'D',mineral:'금강석',x:'68%',y:'52%',hardness:10,magnetic:false,cls:'s-diamond'}
];
const PHYSICAL_RULES=[
  '1. 금강석은 자철석과 붙어서 배열할 수 없다.',
  '2. 석영은 홀수번째 자리에 위치해야 한다.',
  '3. 방해석은 금강석의 오른편에 배치되어야 한다.',
  '4. 자철석은 가장 마지막에 배열할 것.'
];
const REACTION_MINERALS=[
  {id:'r_calcite_1',mineral:'방해석',x:'14%',y:'60%',cls:'s-light'},
  {id:'r_quartz',mineral:'석영',x:'28%',y:'52%',cls:'s-dark'},
  {id:'r_biotite',mineral:'흑운모',x:'66%',y:'57%',cls:'s-dark'},
  {id:'r_magnetite',mineral:'자철석',x:'78%',y:'49%',cls:'s-dark'},
  {id:'r_calcite_2',mineral:'방해석',x:'44%',y:'64%',cls:'s-light'},
  {id:'r_calcite_3',mineral:'방해석',x:'58%',y:'44%',cls:'s-light'}
];
const state={
  room:'intro',tool:null,inventoryOpen:false,notesOpen:false,popup:null,panelOpen:false,commOpen:false,
  logs:['[본부] 잠입 성공. 목표 광물을 확보하라.','[시스템] 광물의 성질을 이용한 인증 장치가 활성화되어 있다.'],
  codes:[],owned:['fakeCard','streakPlate','magnet','acid'],introSeen:{panel:false,comm:false},
  analysisMin:false,analysisSeen:{},analysisAnswer:'',analysisFeedback:'',analysisSolved:false,
  analysisQuestion: ANALYSIS_QUESTIONS[Math.floor(Math.random()*ANALYSIS_QUESTIONS.length)],
  physicalMin:false,scratchFirst:null,magnetChecked:[],slots:[null,null,null,null],physicalFeedback:'',physicalSolved:false,
  bubbles:[],reactionCollected:0,reactionSolved:false,reactedMinerals:[],vaultInput:'',vaultSolved:false
};
function addLog(text){state.logs.push(text)}
function addCode(code){if(!state.codes.includes(code)) state.codes.push(code)}
function addTool(id){if(!state.owned.includes(id)) state.owned.push(id)}
function toggleTool(id){state.tool=state.tool===id?null:id}
function meta(){return META[state.room]}
function toolLabel(){const t=TOOLS.find(t=>t.id===state.tool); return t?t.label:'없음'}
function progress(){const arr=[state.introSeen.panel&&state.introSeen.comm,state.analysisSolved,state.physicalSolved,state.reactionSolved,state.vaultSolved];return Math.round(arr.filter(Boolean).length/5*100)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function openPopup(title,body,desc=''){state.popup={title,body,desc}}
function closeOverlays(){state.inventoryOpen=false;state.notesOpen=false;state.popup=null;state.panelOpen=false;state.commOpen=false}
function openIntroDoor(){
  if(state.tool!=='fakeCard'){openPopup('보안문 단말기','인벤토리에서 위조 카드를 선택해야 한다.');return}
  if(!state.introSeen.panel||!state.introSeen.comm){openPopup('보안문 단말기','안내 패널과 통신 장치를 먼저 확인하면 좋다.');return}
  addLog('[복도] 위조 카드 인증 성공. 표본 분석실 문이 열렸다.'); state.room='analysis'; render();
}
function clickAnalysis(id){
  const m=ANALYSIS_MINERALS.find(v=>v.id===id); if(!m) return;
  if(state.tool!=='streakPlate'){openPopup(`${m.symbol} 표본`,'조흔판을 선택해야 조흔색을 확인할 수 있다.'); render(); return}
  state.analysisSeen[m.id]=true; addLog(`[분석실] ${m.symbol} 표본 조흔색 확인: ${m.streak}`); openPopup(`${m.symbol} 표본`,`조흔판에 긁었을 때 ${m.streak} 가루가 보인다.`); render();
}
function submitAnalysis(){
  const target=ANALYSIS_MINERALS.find(m=>m.mineral===state.analysisQuestion.mineral);
  if(!target||!Object.keys(state.analysisSeen).length){state.analysisFeedback='조흔판으로 표본을 긁어 본 뒤 답을 써 보자.'; render(); return}
  if(state.analysisAnswer.trim().toUpperCase()===target.symbol){
    if(!state.analysisSolved){state.analysisSolved=true; addCode('4'); addTool('physicalKey'); addLog("[분석실] 코드를 획득했습니다. 코드는 '4'입니다. 물성 실험실 열쇠도 획득했습니다."); openPopup('정답 처리 완료',"코드를 획득했습니다. 코드는 '4'입니다. 물성 실험실 열쇠도 획득했습니다.",'표본 분석실 인증 성공');}
    state.analysisFeedback=`정답이다. ${state.analysisQuestion.mineral}에 해당하는 기호는 ${target.symbol}이다.`;
  } else state.analysisFeedback='조흔색을 다시 확인하고 기호를 입력해 보자.';
  render();
}
function openPhysicalDoor(){
  if(!state.analysisSolved) return;
  if(state.tool!=='physicalKey'){openPopup('물성 실험실 문','인벤토리에서 물성 실험실 열쇠를 선택한 뒤 문을 클릭해야 한다.'); render(); return}
  state.room='physical'; render();
}
function clickPhysical(id){
  const m=PHYSICAL_MINERALS.find(v=>v.id===id); if(!m) return;
  if(state.tool==='magnet'){
    if(!state.magnetChecked.includes(m.id)) state.magnetChecked.push(m.id);
    openPopup(`${m.symbol} 표본`,m.magnetic?`${m.symbol} 표본은 자석에 붙는다.`:`${m.symbol} 표본은 자석에 붙지 않는다.`); render(); return;
  }

  if(state.popup){pieces.push(`<div class="overlay"><div class="modal-card"><div class="modal-head"><div><div style="font-size:1.2rem;font-weight:800">${state.popup.title}</div>${state.popup.desc?`<div class="muted" style="margin-top:4px;font-size:.9rem">${state.popup.desc}</div>`:''}</div><button class="close" data-action="close-popup">닫기</button></div><div class="modal-body"><div style="line-height:1.7;color:#e2e8f0">${state.popup.body}</div></div></div></div>`)}
  if(state.panelOpen){pieces.push(`<div class="overlay"><div class="modal-card" style="max-width:640px;background:linear-gradient(135deg,rgba(8,47,73,.96),rgba(15,23,42,.98))"><div class="modal-head"><div><div style="font-size:1.2rem;font-weight:800;color:#cffafe">연구소 안내 패널</div><div class="muted" style="font-size:.85rem;letter-spacing:.12em">RESEARCH FACILITY GUIDE</div></div><button class="close" data-action="close-panel">닫기</button></div><div class="modal-body"><div class="ibox" style="line-height:1.9;background:rgba(2,6,23,.35)">표본의 본질을 증명하라.<br>물성으로 거짓을 걸러라.<br>겉모습보다 <b style="color:#a5f3fc">성질</b>이 진실을 말해 준다.</div></div></div></div>`)}
  if(state.commOpen){pieces.push(`<div class="overlay"><div class="modal-card" style="max-width:760px;background:linear-gradient(180deg,rgba(2,6,23,.98),rgba(3,20,12,.96))"><div class="modal-head"><div><div style="font-size:1.2rem;font-weight:800;color:#bbf7d0">본부 암호 통신</div><div class="muted" style="font-size:.85rem;letter-spacing:.12em">ENCRYPTED TRANSMISSION</div></div><button class="close" data-action="close-comm">닫기</button></div><div class="modal-body mono" style="color:#bbf7d0;line-height:1.9"><div class="ibox" style="background:rgba(0,0,0,.28)">&gt; 조흔판을 사용해라<br>&gt; 자석을 활용해라<br>&gt; 겉모습에 속지 마라</div></div></div></div>`)}
  return pieces.join('');
}
function render(){
  const app=document.getElementById('app');
  const m=meta();
  app.innerHTML=`
  <div class="topbar"><div class="wrap topgrid"><div style="min-width:0;flex:1"><div class="subtitle">${m.subtitle}</div><div class="title">${m.title}</div><div class="objective">현재 임무: ${m.objective}</div></div><div class="hud-mid"><div class="muted" style="font-size:.78rem;display:flex;justify-content:space-between"><span>진행도</span><span>${progress()}%</span></div><div class="progress"><div style="width:${progress()}%"></div></div><div class="muted" style="font-size:.78rem;margin-top:4px">획득 코드: ${state.codes.length?state.codes.join(' '):'_ _ _'}</div></div><div class="hud-right"><div class="badge">선택 도구: ${toolLabel()}</div><button class="btn" data-action="open-notes">노트</button><button class="btn primary" data-action="open-inventory">인벤토리</button></div></div></div>
  <main><div class="scene">${state.room==='intro'?sceneIntro():state.room==='analysis'?sceneAnalysis():state.room==='physical'?scenePhysical():state.room==='reaction'?sceneReaction():sceneVault()}</div></main>
  <div class="bottombar"><div class="wrap"><div class="logwrap"><div class="log" style="min-width:auto;font-weight:700">현장 로그</div>${state.logs.slice(-3).reverse().map(log=>`<div class="log">${escapeHtml(log)}</div>`).join('')}</div></div></div>
  ${renderModal()}`;
  bind();
}
function bind(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click',e=>{
      const action=el.dataset.action, id=el.dataset.id, slot=el.dataset.slot;
      if(action==='open-inventory'){state.inventoryOpen=true; render();}
      else if(action==='open-notes'){state.notesOpen=true; render();}
      else if(action==='close-inventory'){state.inventoryOpen=false; render();}
      else if(action==='close-notes'){state.notesOpen=false; render();}
      else if(action==='close-popup'){state.popup=null; render();}
      else if(action==='close-panel'){state.panelOpen=false; render();}
      else if(action==='close-comm'){state.commOpen=false; render();}
      else if(action==='open-panel'){state.introSeen.panel=true; state.panelOpen=true; render();}
      else if(action==='open-comm'){state.introSeen.comm=true; state.commOpen=true; render();}
      else if(action==='intro-door'){openIntroDoor()}
      else if(action==='select-tool'){toggleTool(id); state.inventoryOpen=false; render();}
      else if(action==='analysis-mineral'){clickAnalysis(id)}
      else if(action==='submit-analysis'){submitAnalysis()}
      else if(action==='open-physical-door'){openPhysicalDoor()}
      else if(action==='toggle-analysis-min'){state.analysisMin=!state.analysisMin; render();}
      else if(action==='physical-mineral'){clickPhysical(id)}
      else if(action==='toggle-physical-min'){state.physicalMin=!state.physicalMin; render();}
      else if(action==='submit-physical'){submitPhysical()}
      else if(action==='clear-slot'){clearSlot(Number(slot))}
      else if(action==='open-reaction-door'){openReactionDoor()}
      else if(action==='reaction-mineral'){clickReactionMineral(id)}
      else if(action==='submit-vault'){submitVault()}
    });
  });
  document.querySelectorAll('[data-bind="analysisAnswer"]').forEach(el=>el.addEventListener('input',e=>{state.analysisAnswer=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,1)}));
  document.querySelectorAll('[data-bind="vaultInput"]').forEach(el=>el.addEventListener('input',e=>{state.vaultInput=e.target.value.replace(/[^0-9]/g,'').slice(0,5)}));
  document.querySelectorAll('.sample[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.id)});
  });
  document.querySelectorAll('.slot').forEach(el=>{
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',e=>{e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); if(id) placeInSlot(Number(el.dataset.slot),id)});
  });
  document.querySelectorAll('.bubble[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.id); el.classList.add('dragging')});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  });
  const collector=document.getElementById('collector');
  if(collector){collector.addEventListener('dragover',e=>e.preventDefault()); collector.addEventListener('drop',e=>{e.preventDefault(); const id=Number(e.dataTransfer.getData('text/plain')); if(id) dropBubble(id);});}
}
render();
</script>
</body>
</html>
